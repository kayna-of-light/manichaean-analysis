      When the congregation speaks these words, they participate in the same
      cosmic event that rescued the First Man. The liturgical act IS the
      cosmic act at the natural degree — not a memorial but an active
      correspondential participation.
    principles:
      - correspondence
      - call_and_response
    confidence: strong
    notes: >
      Chapter 122 extends to describe the assent and amen as creating a
      "beautiful living image sculpted by the faith of the believers, and
      which ascends daily to the land of rest." The sound of the congregation's
      response "collects and comes together, and it fixes and sculpts... a
