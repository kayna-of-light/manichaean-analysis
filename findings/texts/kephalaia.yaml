  - id: KP-025
    category: structural_principle
    passage: >
      "The summons and the obedience... Living Spirit [called] → First Man
      [answered]... Light Mind → church... church → upward response"
    location: "Chapter 75 (K. 184-186)"
    finding: >
      CALL AND RESPONSE AS UNIVERSAL SALVATION MECHANISM. The summons (call
