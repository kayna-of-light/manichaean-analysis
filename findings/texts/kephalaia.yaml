  # =====================================================
  # SECTION F: CHAPTERS 55-56 — The Fashioning of Adam
  # and the Five Faculties
  # =====================================================

  - id: KP-026
    category: cosmological_mapping
    passage: >
      "the Ambassador displayed his image... the rulers and the powers of the
      universe saw his image, and they formed their shapes after his likeness,
      who are Adam and Eve... he did not come so that he might reveal his image
      to the rulers... Rather, he came and displayed because of his soul and his
      son... that he might enable him to live"
    location: "Chapter 55 (K. 133-137)"
    finding: >
      The human form is a COPY of the divine image — the Ambassador's form
      displayed in the heavens, replicated by the rulers in matter. But this
      copying was NOT divinely intended. The Ambassador displayed his image
      for the purpose of liberating the trapped soul, and the rulers seized
      this image in lust and fashioned Adam and Eve. The human form is thus
      a correspondential ECHO — the divine image translated into material
      form through the medium of desire. The correspondence is real (humans
      DO reflect the divine image) but the mechanism is distorted (the copy
      is made through lust, not love).
    principles:
      - divine_human
      - correspondence
      - proprium
    confidence: strong
    notes: >
      Mani uses the analogy of a beautiful, noble woman forced out of her
      chamber to rescue her brother, seen by all men who lust for her beauty.
      The image is divine; the copying is profane. The correspondence exists
      but is mediated by the proprium.

  - id: KP-027
    category: correspondence
    passage: >
      "the faculty of the eyes has houses and cavities and repositories and
      stores within... the faculty of the ears has its own storehouses also...
      the faculty of scent... the faculty of taste... the faculty of touch...
      the faculty of the heart that rules over them all... the counsel of
      the heart is like the king. All the advisers of his city and the
      leaders of his army are placed with him."
    location: "Chapter 56 (K. 138.20 - 141.1)"
    finding: >
      THE FIVE SENSES AS CORRESPONDENCE MAP. Each sensory faculty (sight,
      hearing, scent, taste, touch) has its own "storehouses" and "repositories"
      — inner chambers that receive, store, and can reproduce sensory memories.
      The heart governs them all as a king governs his counsellors. This is
      the human cognitive system described as an interior architecture — the
      senses as portals between outer world and inner world, each with its
      own dedicated storage, all governed by the central faculty (heart).
    principles:
      - correspondence
      - divine_human
    confidence: strong
    notes: >
      The heart-as-king analogy is not merely literary. In Chapter 56's
      continuation, when the Light Mind enters, it takes over these sensory
      "gates" — closing them to lust and opening them to righteousness.
      The senses are correspondential portals whose operation changes
      depending on which principle governs them.

  # =====================================================
  # SECTION G: CHAPTER 85 — Cross of Light
  # and CHAPTER 86 — Inner States
  # =====================================================

  - id: KP-028
    category: correspondence
    passage: >
      "The Cross refers principally to that most rich source of light:
      vegetation and all plant life, where the divine hangs on every tree
      or bush or herb."
    location: "Chapter 85, Gardner's introduction (K. 208.11)"
    finding: >
      THE CROSS OF LIGHT = divine soul in vegetation. This is a systematic
      natural → spiritual correspondence: plant life = crucified divinity.
      Light is trapped in all matter, but MOST CONCENTRATED in vegetation —
      because plants are the most direct transformation of light into living
      form. The botanical corresponds to the theological: photosynthesis
      (natural) corresponds to the crucifixion of divine light in matter
      (spiritual).
    principles:
      - correspondence
      - light_captivity
    confidence: strong
    notes: >
      The elect's careful treatment of vegetation — not plucking fruit
      themselves, having catechumens prepare their food — is not mere
      ritual but correspondential logic: if plants = concentrated divine
      light, then harming vegetation = harming the divine soul. The
      practice follows from the correspondence.

  - id: KP-029
    category: correspondence
    passage: >
      "Every elect and righteous person who walks on a path due to the work
      of God, and though walking upon the earth and though treading with the
      soles of his feet on the Cross of Light, he does no sin therein. Rather,
      a crown and palm-branch is his entire path; because he walks not by his
      own desire."
    location: "Chapter 85 (K. 209.12-19)"
    finding: >
      INTENTION DETERMINES CORRESPONDENTIAL VALENCE. Walking on the Cross of
      Light (vegetation, living soil) is not sinful when done for divine purpose,
      but IS sinful when done "about some lustful matter." The same physical
      action has opposite spiritual correspondence depending on the person's
      ruling love — selfless service vs. self-serving desire. This is the
      ruling love principle determining the spiritual quality of natural acts.
    principles:
      - ruling_love
      - correspondence
    confidence: strong
    notes: >
      Mani uses the doctor analogy: a doctor who tramples on a patient to
      heal does not sin; a stranger who tramples in enmity does. The ACT
      is identical; the INTENTION determines the correspondence. This is
      directly parallel to Swedenborg's teaching that the same natural act
      can correspond to good or evil depending on the ruling love.

  - id: KP-030
    category: correspondence
    passage: >
      "Sometimes I am peaceful in my heart, as my consideration is constructive...
      There are also times when I shall be troubled. My doctrines are confused.
      Gloom increases with them, and grief and anger and envy and lust..."
    location: "Chapter 86 (K. 213.27 - 214.19)"
    finding: >
      INNER STATES CORRESPOND TO MULTIPLE EXTERNAL CAUSES. The disciple describes
      alternating peace and disturbance. Mani attributes these to: (1) birth-signs
      and difficult stars, (2) food quality — "the nourishment of the bread he has
      eaten and the water he has drunk, which are full of bothersome parts" that
      "become joined in with the wicked parts of the body." Food as vehicle of
      spiritual influence = natural substance corresponding to spiritual state.
      What enters the body physically affects the soul through correspondence.
    principles:
      - correspondence
      - influx
    confidence: moderate
    notes: >
      The teaching that food quality affects spiritual states — peace from pure
      nourishment, disturbance from impure — is the Manichaean version of
      somatic influx. The body is not separate from the spirit; what enters
      physically enters spiritually. Compare with the framework's somatic
      influx extension.

  # =====================================================
  # SECTION H: CHAPTERS 109, 112, 115, 122 — Later Chapters
  # Liturgical Correspondence and Eschatological Architecture
  # =====================================================

  - id: KP-031
    category: explicit_statement
    passage: >
      "Concerning the Fifty Lord's Days; to what Mysteries do they correspond?"
    location: "Chapter 109, title (K. 262.10)"
    finding: >
      The chapter TITLE uses the word "correspond" — asking explicitly to what
      mysteries the fifty lord's days CORRESPOND. The answer is systematic:
      the first fifty correspond to the mystery of the First Man (five powers
      × five sons = twenty-five, doubled for ascent), the second fifty to
      the mystery of Jesus (forty days fasting + seven in leper's house +
      three in tomb). Liturgical time = cosmic archetype through explicit
      correspondence.
    principles:
      - correspondence
      - discrete_degrees
    confidence: strong
    notes: >
      This chapter's title contains the word "correspond" explicitly.
      Liturgical practice is not arbitrary ritual but correspondential
      participation — the catechumens' fifty fasts are not "symbolic of"
      the First Man's suffering but CORRESPOND TO it at the natural degree.

  - id: KP-032
    category: correspondence
    passage: >
      "If one of all these five words of the flesh... today on the surfaces
      of the earth... they will neither come to breadth corresponding to
      its breadth, nor to width corresponding to its width, nor to depth
      corresponding to its depth."
    location: "Chapter 112 (K. 266.14-22)"
    finding: >
      Mani stands in a dry river-bed, gestures at a mountain, and teaches:
      all of humanity gathered together would not equal one mountain in size.
      Yet it is humanity — the smallest thing — that blasphemes against the
      greatest. The lesson operates through SCALE CORRESPONDENCE: the physical
      smallness of humanity corresponds to its spiritual smallness when it
      blasphemes. The mountain's magnitude and silence corresponds to the
      magnitude and peace of the divine. Gardner's translation uses
      "corresponding to" three times in this passage.
    principles:
      - correspondence
    confidence: moderate
    notes: >
      Teaching through physical demonstration — Mani standing in the
      landscape and using what he sees to teach correspondential truths.
      The method itself is correspondential: the natural scene IS the
      spiritual lesson made visible.

  - id: KP-033
    category: structural_principle
    passage: >
      "the Mother of Life... besought the Father for a helper, on behalf of the
      First Man; and was granted the Living Spirit... the Great Spirit stood with
      the Beloved of the Lights... They besought of him... the Third Ambassador...
      the faithful saints... over the one who has been released from his body.
      They shall be granted their entreaty just as the Mother of Life was given
      the entreaty"
    location: "Chapter 115 (K. 271-280)"
    finding: >
      PRAYER AS CORRESPONDENTIAL PARTICIPATION IN COSMIC ARCHETYPES. Three
      archetypal supplications (Mother of Life → Father for Living Spirit;
      five gods → Father for Ambassador; further petitions for Jesus Splendour)
      establish the PATTERN that human prayer for the dead follows. Human
      intercession CORRESPONDS TO divine intercession — the same act at
      different cosmic levels. "They shall be granted their entreaty just as
      the Mother of Life was given the entreaty" — explicit correspondence
      between human and divine prayer.
    principles:
      - correspondence
      - discrete_degrees
      - influx
    confidence: strong
    notes: >
      This is one of the most practically important correspondential teachings
      in the Kephalaia. Prayer for the dead is not merely hoped-for intervention
      but participates in the same structure as cosmic redemption. What the
      Mother of Life did for the First Man, the saint does for the deceased
      soul — the same act at a different degree.

  - id: KP-034
    category: structural_principle
    passage: >
      "the assent belongs to the summons and the amen belongs to the answer...
      Just as the summons and the obedience are the ones that opened the portals
      of mercy and entreaty for the First Man, so they also became portals for
