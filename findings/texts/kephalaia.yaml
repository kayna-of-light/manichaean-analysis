      correspondence.

  # =====================================================
  # SECTION I: ANOMALIES AND DIVERGENCES
  # Where the Kephalaia resists or complicates the framework
  # =====================================================

  - id: KP-035
    category: structural_principle
    passage: >
      "the souls of all the sinners who have been condemned by their deeds...
      they will be crucified on the enemy... They will seal up this final lump
      when all the likenesses and images of every shape will be nailed in it."
    location: "Chapter 40 (K. 104.25 - 105.13)"
    finding: >
      THE FINAL LUMP = PERMANENT RULING LOVE. Initially classified as an
      anomaly, but on closer examination this is a HIT. Swedenborg teaches
      that after death the ruling love becomes permanent and irrevocable:
      the exterior is stripped, the interior is revealed, and the soul
      gravitates to its eternal state based on its ruling love. A soul in
      hell cannot repent because self-love IS what they have become. Mani's
      "final lump" is the same doctrine in cosmological imagery: souls so
      deeply oriented toward darkness that their state is irrevocable. Not
      arbitrary punishment but the consequence of what the soul has become.
      The imagery differs (Swedenborg: self-chosen hell; Mani: sealed lump)
      but the structural principle is identical — the ruling love, once
      fully dominant, locks the soul into its eternal state.
    principles:
      - ruling_love
      - correspondence
    confidence: strong
    notes: >
      Previously classified as anomaly. Reclassified upon recognizing that
      Swedenborg's permanent ruling love after death and Mani's final lump
      are structurally identical teachings. The difference is cosmological
      framing (Manichaean dualism) vs. psychological framing (Swedenborgian
      ruling love), not substantive theological disagreement. Both agree:
      the orientation becomes permanent, and this is not external punishment
      but the soul's own state made irrevocable.

  - id: KP-036
    category: structural_principle
    passage: >
      "souls of sinful men shall die... they are separated from the living air,
      from which they receive living breath; and they are separated and swept
      away from this Last Statue"
    location: "Chapter 39 (K. 104.5-12)"
    finding: >
      THE SECOND DEATH — SPIRITUAL DEATH, NOT EXTINCTION. Initially read
      as total cessation, but correspondential reading corrects this:
      air = truth/understanding. "Separated from the living air" =
      separated from living truth = separated from the influx of divine
      wisdom. This IS spiritual death in Swedenborg's sense — not
      existential extinction but permanent separation from what gives
      spiritual life. The soul still exists (Mani says they are "swept
      away" and "sealed," not annihilated) but is cut off from the
      source of living truth. Swedenborg says the same: those in hell
      still receive life (all life comes from the Lord) but twist it
      entirely into self-love. They are dead while still existing.
      "The first death is temporal; but the second death is eternal" =
      the first death is natural (body dies); the second death is
      spiritual (the ruling love of self becomes permanent). Two deaths
      at two discrete degrees.
    principles:
      - ruling_love
      - correspondence
      - discrete_degrees
    confidence: strong
    notes: >
      Previously classified as anomaly based on a too-literal reading.
      Reclassified upon recognizing that "separated from living air" is
      a correspondential statement: air = truth. The soul is not
      extinguished but permanently cut off from living truth — which is
      exactly Swedenborg's description of the hellish state. The
      "extinction" reading was a natural-plane reading of a
      correspondential text — the very error the framework warns against.

  - id: KP-037
    category: structural_principle
    passage: >
      "the light elements cause the dark to be discharged as a child is from
      its mother... His mother also is just like this child. The marrow and the
      bones, the sinews and flesh, the veins and blood and skin..."
    location: "Chapter 42 (K. 107.26 - 108.16)"
    finding: >
      DEGREE-APPROPRIATE DESCRIPTION OF COSMIC PURIFICATION. Initially
      classified as anomaly ("mechanical salvation"), but the Kephalaia
      itself demonstrates why this is not an anomaly: the text describes
      the SAME process at different discrete degrees with degree-appropriate
      imagery. At the COSMIC level (Ch 42), purification appears structural
      and architectural — discharge, sweeping, engineering. At the PERSONAL
      level (Ch 38), the Light Mind's work is deeply organic — liberating
      each faculty, installing love/faith/perfection/patience/wisdom,
      working with the church community. This is the same reality perceived
      at different degrees looking different BECAUSE of the degree.
      Swedenborg does the same: his descriptions of the Grand Man's
      organization are structural and architectural, while his descriptions
      of personal regeneration are organic and relational. The cosmic looks
      mechanical; the personal looks living. Both are accurate — at their
      respective degrees.
    principles:
      - discrete_degrees
      - regeneration
      - correspondence
    confidence: strong
    notes: >
      Previously classified as anomaly. Reclassified upon recognizing that
      the "mechanical" cosmic description and the "living" personal
      description are not contradicting each other — they are the same
      process at different degrees. The natural-ultimate level (cosmic
      scale) has maximum structure and minimum apparent personality. The
      personal level is where influx meets reception directly, so it
      appears organic. This is itself a demonstration of discrete degrees
      in operation: the same truth expressed differently at each level.

  # =====================================================
  # SECTION J: CROSS-REFERENCES
  # Connections to other texts and traditions
  # =====================================================

  - id: KP-038
    category: cross_reference
    passage: >
      "Sethel... Enos... Enoch... Sem... Buddha and Aurentes... Zarathustra...
      Jesus... Paul... Mani"
    location: "Chapter 1 (K. 12-15)"
    finding: >
      The apostle succession chain explicitly includes Zarathustra and Buddha.
      This connects to: (1) The Apocryphon of John's "book of Zoroaster" and
      the Apocalypse of Adam's "generation without a king" tradition;
      (2) Swedenborg's claim that the Ancient Word was preserved "among the
      peoples of the East" / "Great Tartary"; (3) The Manichaean transmission
      route through Central Asia (Uyghur Kingdom of Qocho, Turfan) which is
      geographically "Great Tartary." Mani's chain does not merely list
      prophets — it traces a TRANSMISSION PATH.
    principles:
      - ancient_word
      - constant_state_variable_form
    confidence: strong
    notes: >
      The inclusion of "Aurentes" alongside Buddha is significant — this
      may be a reference to Arhat or another Buddhist figure, showing
      that Mani's knowledge of the Indian tradition was more specific
      than generic awareness. Cross-reference with NHL findings on
      Apocryphon of John and Apocalypse of Adam.

  - id: KP-039
    category: cross_reference
    passage: >
      "(Sin) bound the soul in the five members of the body. It bound the mind
      in bone; the thought in sinew; the insight in vein; the counsel in flesh;
      the consideration in skin."
    location: "Chapter 38 (K. 95.17-19)"
    finding: >
      PARALLEL TO APOCRYPHON OF JOHN. The Apocryphon describes "seven substance-
      souls" created by the archons: bone/goodness, sinew/foreknowledge,
      flesh/divinity, marrow/lordship, blood/kingdom, skin/envy, hair/understanding.
      The Kephalaia has five soul-qualities bound in five body-tissues:
      mind/bone, thought/sinew, insight/vein, counsel/flesh, consideration/skin.
      Both systems: (a) map spiritual faculties to specific body tissues;
      (b) include bone and sinew as primary tissues; (c) treat the body as
      a prison for divine qualities. The overlap is too specific to be
      coincidence — both draw from a shared body-correspondence tradition.
    principles:
      - ancient_word
      - divine_human
    confidence: strong
    notes: >
      The differences are also significant: the Apocryphon has seven
      substances, the Kephalaia has five (matching the pentadic system
      throughout). Different traditions preserving the same structural
      principle with different internal organization — constant state,
      variable form at the level of the correspondence system itself.
