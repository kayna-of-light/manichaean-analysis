open_questions:

  - id: OQ-001
    question: >
      What is the GERMAN translation of ⲧⲥⲃⲱ in Polotsky/Böhlig?
      If they used 'Einsicht' (insight), Gardner may have followed them.
      If they used 'Lehre' (teaching/doctrine), Gardner innovated.
    status: "✅ RESOLVED — 2025-07-15"
    priority: high
    resolution: >
      Polotsky/Böhlig use **"Einsicht"** (insight/discernment) consistently
      for ⲧⲥⲃⲱ throughout the German critical edition.

      VERIFIED ON TWO KEY PAGES:

      1. German p.20 (K.20 five-faculty cosmic mapping), lines 12-16:
         "...hat fünf Glieder: die Überlegung, das Sinnen, die EINSICHT,
         das Denken, [der Noûs]. ... [Seine Einsicht] [ist der] Urmensch,
         der wohnt in dem Schiffe der [lebendigen] Wasser."

      2. German p.95 (K.95 five-faculty binding), lines 17-22:
         "...fesselte den Noûs in dem Knochen, das Denken in der Sehne,
         die EINSICHT in der Ader, das Sinnen im Fleisch, die Überlegung
         in der Haut."

      CRITICAL FOOTNOTE (German p.20, note 13):
         "Koptische Übersetzung für λογισμός, ἐνθύμησις, φρόνησις, ἔννοια."
         This explicitly gives the GREEK behind each Coptic faculty term.
         The editors identify ⲧⲥⲃⲱ as translating ἔννοια (ennoia).

      THE TRANSMISSION CHAIN:
        (a) Greek original: ἔννοια (ennoia) — "concept, notion, insight"
        (b) Coptic translation: ⲥⲃⲱ (sbo) — "teaching, instruction"
        (c) German edition (1940): "Einsicht" — back-translating from ἔννοια
        (d) Gardner (1995): "insight" — following the German

      SIGNIFICANCE: Gardner followed Polotsky/Böhlig. He did NOT innovate
      independently. But the deeper finding is that BOTH the German editors
      and Gardner privileged the reconstructed Greek (ἔννοια) over the
      actual Coptic word (ⲥⲃⲱ = teaching). The Coptic scribes CHOSE
      a word meaning "teaching/instruction" as their rendering of the
      Greek concept. This choice preserves correspondential directionality:
      what is RECEIVED from outside (teaching), not what arises from
      within (insight). The editorial tradition lost this by back-translating
      through the Greek.

      GERMAN FIVE-FACULTY LIST (Polotsky/Böhlig p.20, lines 12-14):
      Listed outer → inner (ascending), matching the K.20 Coptic:
        5. die Überlegung (reflection) ← ⲙⲁⲕⲙⲉⲕ — fn: λογισμός
        4. das Sinnen (pondering) ← ⲥⲁⲭⲛⲉ — fn: ἐνθύμησις
        3. die Einsicht (insight) ← ⲥⲃⲱ — fn: φρόνησις
        2. das Denken (thinking) ← ⲙⲉⲩⲉ — fn: ἔννοια
        1. [der Noûs] (mind) ← ⲛⲟⲩⲥ — direct Greek loanword

      NOTE ON ORDERING: The German (and Coptic K.20) lists from outer
      to inner. This findings file uses the cosmic hierarchy order
      (inner to outer: Noûs→Thought→Teaching→Counsel→Consideration).
      The numbering above shows our standard position numbers.

      NOTE ON THE GREEK: No Greek Kephalaia manuscript survives.
      Gardner (1995, p. xviii) says the Coptic is translated from
      "Syriac originals." The Kellis bilingual glossaries confirm
      direct Syriac → Coptic translation. Polotsky/Böhlig's Greek
      terms are scholarly identifications of philosophical equivalents,
      not necessarily terms from an actual source text.

