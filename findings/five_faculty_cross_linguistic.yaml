# ============================================================================
# Five Faculty Cross-Linguistic Comparison
# Follow-up to Gardner Translation Analysis (gardner_translation_analysis.yaml)
# ============================================================================
#
# Four independent linguistic traditions name the five Shekinahs/faculties
# of the Father of Greatness. This file documents how each tradition renders
# the five faculties, maps them cosmically, and what the cross-comparison
# reveals about Gardner's "insight" substitution.
#
# Sources:
#   1. Coptic Kephalaia (Polotsky/Böhlig; Gardner tr. 1995)
#   2. Arabic Fihrist of Ibn al-Nadim (c. 987 CE; Ferard tr.)
#   3. Syriac Theodore bar Konai, Scholion (8th century; BeDuhn tr.)
#   4. Parthian Hymn M680 (Turfan; Waldschmidt-Lentz tr.)
#
# ============================================================================

analysis_date: "2025-07-15"
depends_on: "gardner_translation_analysis.yaml"

# ============================================================================
# THE FOUR TRADITIONS
# ============================================================================

traditions:

  coptic_kephalaia:
    source: "Papyrus Berolinensis 15996 (Polotsky/Böhlig edition)"
    translation: "Iain Gardner, The Kephalaia of the Teacher (Brill, 1995)"
    dialect: "Lycopolitan (L4 / sub-Achmimic)"
    key_passage: "K.20 lines 12-20 (Chapter 2, five-fold tree)"
    faculty_list:
      - position: 1
        coptic: "ⲡⲛⲟⲩⲥ"
        transliteration: "pnous"
        etymology: "Greek loanword νοῦς"
        gardner: "mind"
        literal: "mind/nous"
        cosmic_being: "Father of Greatness"
        coptic_cosmic: "ⲡⲓⲱⲧ ⲡⲉⲧⲟⲩⲏϩ ϩⲛ ⲧⲙⲛⲧⲛⲁⲃ"
        body_tissue: "ⲡⲕⲉⲥ (bone)"
        regeneration_virtue: "ⲧⲁⲅⲁⲡⲏ (love)"
        liberation_verb: "ⲧⲟⲩⲱ (RAISE) + ⲃⲁⲗ (loosen from)"
      - position: 2
        coptic: "ⲡⲙⲉⲩⲉ"
        transliteration: "pmeue"
        etymology: "Native Coptic: ⲙⲉⲩⲉ = to think, ponder"
        gardner: "thought"
        literal: "thought/thinking"
        cosmic_being: "Third Ambassador (Messenger)"
        coptic_cosmic: "ⲡⲙⲁϩϣⲁⲙⲧ ⲙⲡⲣⲉⲥⲃⲉⲩⲧⲏⲥ"
        body_tissue: "ⲡⲙⲟⲩⲧ (sinew)"
        regeneration_virtue: "ⲡⲛⲁϩⲧⲉ (faith)"
        liberation_verb: "ⲃⲱⲗ (LOOSEN)"
      - position: 3
        coptic: "ⲧⲥⲃⲱ"
        transliteration: "tsbo"
        etymology: "Native Coptic: ⲥⲃⲱ/ⲥⲃⲟ = to teach, to learn; ⲥⲃⲱ = teaching, instruction"
        gardner: "insight"
        literal: "TEACHING / INSTRUCTION"
        cosmic_being: "First Man (Ohrmazd)"
        coptic_cosmic: "ⲡϣⲁⲣⲡ ⲛ̄ⲣⲱⲙⲉ"
        body_tissue: "ⲡⲙⲟⲙⲉ (vein)"
        regeneration_virtue: "ⲡⲭⲱⲕ ⲁⲃⲁⲗ (completion/perfection)"
        liberation_verb: "ⲃⲱⲗ (LOOSEN)"
      - position: 4
        coptic: "ⲡⲥⲁⲭⲛⲉ"
        transliteration: "psachne"
        etymology: "Native Coptic: ⲥⲁⲭⲛⲉ = to investigate, counsel, deliberate"
        gardner: "counsel"
        literal: "counsel/deliberation"
        cosmic_being: "Pillar of Glory / Perfect Man"
        coptic_cosmic: "ⲡⲥⲧⲩⲗⲟⲥ ⲙⲡⲉⲁⲩ ⲡⲣⲱⲙⲉ ⲉⲧⲭⲏⲕ ⲁⲃⲁⲗ"
        body_tissue: "ⲧⲥⲁⲣⲝ̄ (flesh)"
        regeneration_virtue: "ⲧⲙⲛⲧϩⲁⲣϣϩⲏⲧ (patience)"
        liberation_verb: "ⲧⲟⲩⲱ (RAISE) + ⲃⲁⲗ (loosen from)"
      - position: 5
        coptic: "ⲡⲙⲁⲕⲙⲉⲕ"
        transliteration: "pmakmek"
        etymology: "Native Coptic: ⲙⲁⲕⲙⲉⲕ = to ponder, reflect, think carefully"
        gardner: "consideration"
        literal: "consideration/pondering"
        cosmic_being: "Holy Church (Ecclesia)"
        coptic_cosmic: "ⲧⲉⲕⲕⲗⲏⲥⲓⲁ ⲉⲧⲟⲩⲁⲃⲉ"
        body_tissue: "ⲡϣⲁⲁⲣⲉ (skin)"
        regeneration_virtue: "ⲧⲥⲟⲫⲓⲁ (wisdom)"
        liberation_verb: "ⲃⲱⲗ (LOOSEN)"

  arabic_fihrist:
    source: "Kitāb al-Fihrist of Ibn al-Nadim (c. 987 CE)"
    translation: "Camilla Ferard (based on Flügel 1861)"
    language: "Arabic"
    key_passage: "Fihrist 329.3-5"
    notes: >
      Ibn al-Nadim was an Islamic bibliographer who recorded Manichaean
      doctrine from available sources. This is a secondary account, not
      a Manichaean text proper, but it preserves the Arabic terminology
      used for the five faculties.
    faculty_list:
      - position: 1
        arabic: "الحلم"
        transliteration: "al-ḥilm"
        english: "meekness / forbearance / prudence"
        notes: "Significantly different from Coptic ⲡⲛⲟⲩⲥ (mind)"
      - position: 2
        arabic: "العلم"
        transliteration: "al-ʿilm"
        english: "knowledge / science"
        notes: "ʿilm = knowledge as accumulated learning, received information"
      - position: 3
        arabic: "العقل"
        transliteration: "al-ʿaql"
        english: "understanding / reason / intellect"
        notes: "NOT 'teaching' (taʿlīm) or 'insight' (fiṭna). ʿaql = rational faculty"
      - position: 4
        arabic: "الغيب"
        transliteration: "al-ghayb"
        english: "mystery / the unseen / hidden knowledge"
        notes: "Unique to the Arabic tradition; no parallel in other lists"
      - position: 5
        arabic: "الفطنة"
        transliteration: "al-fiṭna"
        english: "insight / sagacity / perspicacity"
        notes: >
          CRITICAL: 'Insight' (fiṭna) appears here at position 5,
          NOT at position 3 where Gardner places it. This is the only
          tradition where 'insight' appears at all as a faculty name.
    spiritual_properties:
      note: >
        The Fihrist lists five ADDITIONAL spiritual properties alongside the
        five faculties, which correspond to the Kephalaia's regeneration virtues.
      list:
        - "love (الحبّ)"
        - "faith (الإيمان)"
        - "fidelity (الوفاء)"
        - "nobleness (المروّة)"
        - "wisdom (الحكمة)"
      kephalaia_virtues: "love, faith, perfection, patience, wisdom"
      matches: "Positions 1, 2, and 5 match exactly (love, faith, wisdom). Positions 3-4 differ."

  syriac_theodore:
    source: "Theodore bar Konai, Scholion (8th century CE)"
    translation: "BeDuhn (DB Anthology 2)"
    language: "Syriac"
    key_passage: "DB Anthology 2, Canonical Texts section"
    notes: >
      Theodore bar Konai was a Nestorian bishop who wrote a heresiological
      compendium. His account of Manichaean doctrine is detailed and generally
      considered reliable. He gives both the Father's five Shekinahs and the
      Living Spirit's five sons derived from them.
    faculty_list:
      - position: 1
        english: "mind"
        living_spirit_son: "Ornament of Splendour"
      - position: 2
        english: "knowledge"
        living_spirit_son: "Great King of Honour"
      - position: 3
        english: "intellect"
        living_spirit_son: "Adamos of Light"
        notes: >
          NOT 'teaching' or 'insight'. The Syriac term (likely rʿyānā or
          hawnā) means 'intellect/intelligence' — a cognitive faculty
          distinct from both 'teaching' (received instruction) and
          'insight' (self-generated perception).
      - position: 4
        english: "thought"
        living_spirit_son: "King of Glory"
      - position: 5
        english: "reflection"
        living_spirit_son: "Porter"

  parthian_hymn_m680:
    source: "M680 (Turfan fragment), Parthian"
    translation: "Waldschmidt-Lentz (DB Anthology 4)"
    language: "Parthian (Middle Iranian)"
    key_passage: "M680 R lines 13-16"
    notes: >
      This is a Parthian hymn from the Turfan collection — directly from
      the Central Asian Manichaean community. The five terms appear in an
      invocation to a divine figure, greeting each faculty as present in
      the worshippers.
    faculty_list:
      - position: 1
        parthian: "b'm"
        transliteration: "bām"
        english: "brilliance / radiance"
        notes: "Distinguished from 'mind' — this is LIGHT vocabulary"
      - position: 2
        parthian: "mnwhmyd"
        transliteration: "manuhmed"
        english: "mind / nous"
        notes: "Cognate with Greek νοῦς via Iranian manuhmēd"
      - position: 3
        parthian: "'ws"
        transliteration: "ōš"
        english: "consciousness / awareness"
        notes: >
          NOT 'teaching' or 'insight' or 'intellect'. ōš = consciousness,
          awareness, wakefulness. This is a faculty of RECEPTION — being
          open and awake to what comes.
      - position: 4
        parthian: "'ndyšyšn"
        transliteration: "andēšišn"
        english: "thought / thinking"
        notes: "Active cognitive processing"
      - position: 5
        parthian: "prm'ng"
        transliteration: "parmāng"
        english: "thought / reasoning / intention"
        notes: "Distinguished from andēšišn by the qualifier 'free of grief'"
    full_text: >
      "You are welcome, our gathered brilliance (bām) and our true mind
      (manuhmed). You are welcome, our full consciousness (ōš), our zealous
      thought (andēšišn), and our thought (parmāng) free of grief."

