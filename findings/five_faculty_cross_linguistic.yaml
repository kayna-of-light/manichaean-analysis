# ============================================================================
# FINDINGS
# ============================================================================

findings:

  - id: FCL-001
    category: cross_reference
    title: "Constant State, Variable Form operating on the five faculties themselves"
    finding: >
      The four independent linguistic traditions name the five faculties
      completely differently. Not a single position has the SAME word across
      all four traditions. This is the framework's 'constant state, variable
      form' principle operating on the doctrine's own central architecture.

      The five REALITIES are constant — the Father of Greatness possesses
      five attributes that are transmitted through cosmic emanation into
      the human soul. But the NAMES given to these five realities vary
      entirely by linguistic and cultural context:

      Position 1: mind / meekness / mind / brilliance
      Position 2: thought / knowledge / knowledge / mind
      Position 3: TEACHING / intellect / intellect / consciousness
      Position 4: counsel / mystery / thought / thought
      Position 5: consideration / insight / reflection / reasoning

      The names are cultural vessels. The realities they contain are constant.
    principles:
      - constant_state_variable_form
    confidence: strong
    notes: >
      This IS the Manichaean doctrine of accommodation in practice. Mani
      explicitly taught that each prophet brings the same truth in the
      cultural vessel appropriate to the audience. The five faculty names
      are a microcosm of this principle.

  - id: FCL-002
    category: cross_reference
    title: "'Insight' appears only in Arabic, at position 5 — not position 3"
    finding: >
      Gardner renders ⲧⲥⲃⲱ (position 3) as 'insight.' The cross-linguistic
      evidence shows:

      - Position 3 in Arabic: العقل (ʿaql) = intellect/reason — NOT insight
      - Position 3 in Syriac: 'intellect' — NOT insight
      - Position 3 in Parthian: ōš = consciousness — NOT insight
      - Position 3 in Coptic: ⲥⲃⲱ = TEACHING — NOT insight

      The word 'insight' (الفطنة, fiṭna) appears ONLY in the Arabic Fihrist,
      and it appears at position 5, not position 3.

      No tradition — not Arabic, not Syriac, not Parthian, not the Coptic
      itself — supports 'insight' at position 3. Gardner's substitution
      has no cross-linguistic warrant.
    principles:
      - correspondence
    confidence: strong
    notes: >
      If Gardner drew on any tradition for 'insight,' it could only have
      been the Arabic Fihrist's fifth position — misplaced to the third.
      More likely, he chose 'insight' because it reads more naturally as
      an English cognitive faculty than 'teaching' does.

  - id: FCL-003
    category: cross_reference
    title: "The Coptic translators deliberately chose ⲥⲃⲱ ('teaching')"
    finding: >
      The Coptic translators had access to multiple Greek terms they could
      have used for position 3. Greek ⲉⲛⲛⲟⲓⲁ (ennoia = 'insight/thought')
      was available and used elsewhere in Coptic texts (it appears in the
      Nag Hammadi Library frequently). Greek ⲥⲩⲛⲉⲥⲓⲥ (synesis = 'insight/
      understanding') was also available.

      Instead, they chose the NATIVE Coptic word ⲥⲃⲱ, whose meaning
      ('teaching, instruction, learning') is unambiguous. Four of the
      five faculty terms are native Coptic (only ⲡⲛⲟⲩⲥ is a Greek
      loanword). The translators were making active, considered choices.

      They chose ⲥⲃⲱ because the Syriac/Aramaic source term — whatever
      it was — carried the meaning of 'received instruction,' and ⲥⲃⲱ
      was the most precise Coptic rendering of that meaning.
    principles:
      - correspondence
      - influx
    confidence: moderate
    notes: >
      We cannot directly verify the Syriac/Aramaic source term, since no
      Syriac Kephalaia manuscript survives. But the Coptic translators'
      choice is a translation decision, and ⲥⲃⲱ is the decision they made.

  - id: FCL-004
    category: structural_principle
    title: "ⲧⲟⲩⲱ/ⲃⲱⲗ verb alternation correlates with cosmic axis"
    finding: >
      In the liberation passage (K.96 lines 13-21), two distinct verbs
      alternate in a non-random pattern:

      ⲧⲟⲩⲱ ('raise/lift up' — vertical motion):
        Position 1: nous → Father of Greatness (the absolute source)
        Position 4: counsel → Pillar of Glory / Perfect Man (cosmic axis)

      ⲃⲱⲗ ('loosen/untie' — horizontal unbinding):
        Position 2: thought → Third Ambassador (horizontal communication)
        Position 3: teaching → First Man (mission into darkness)
        Position 5: consideration → Holy Church (earthly reception)

      The two faculties that receive ⲧⲟⲩⲱ ('raise') correspond to the
      VERTICAL cosmic axis — the Father (absolute above) and the Pillar
      (structural axis connecting above and below). The three faculties
      that receive ⲃⲱⲗ ('loosen') correspond to OPERATIONAL entities that
      work horizontally within the mixture — the Messenger (communicates),
      the First Man (descends into battle), the Church (receives on earth).

      Binding (K.95) uses a SINGLE verb (ⲁϩⲙⲁⲣ, 'bind') for all five.
      Captivity is uniform and undifferentiated. Liberation is discriminating
      — different faculties require different modes of release.
    principles:
      - discrete_degrees
      - correspondence
    confidence: moderate
    notes: >
      This finding requires further investigation. The vertical/horizontal
      pattern is suggestive but could be coincidental with only five data
      points. The binding-is-uniform / liberation-is-differentiated
      observation is more robust — it holds across all five positions.

  - id: FCL-005
    category: cross_reference
    title: "The Fihrist's five 'spiritual properties' confirm the regeneration virtues"
    finding: >
      The Arabic Fihrist lists 'five other spiritual properties' alongside
      the five faculties: love, faith, fidelity, nobleness, wisdom.

      The Coptic Kephalaia lists five regeneration virtues that REPLACE
      the five faculties in the new person: love, faith, perfection,
      patience, wisdom.

      Alignment:
        Position 1: love = love (MATCH)
        Position 2: faith = faith (MATCH)
        Position 3: fidelity ≠ perfection (DIVERGENT)
        Position 4: nobleness ≠ patience (DIVERGENT)
        Position 5: wisdom = wisdom (MATCH)

      The outer positions (1, 2, 5) match exactly across Arabic and Coptic.
      The inner positions (3, 4) diverge — the same 'constant state, variable
      form' pattern operating at the virtue level as at the faculty level.

      This independently confirms that the Manichaean system ALWAYS had
      two tiers — five faculties and five corresponding virtues — and that
      the Fihrist preserves a genuine tradition, not a garbled summary.
    principles:
      - constant_state_variable_form
      - regeneration
    confidence: strong

  - id: FCL-006
    category: cross_reference
    title: "Apocryphon of John body-correspondence system shares architecture"
    finding: >
      The Apocryphon of John (NHL II,1) maps seven spiritual powers to
      seven body tissues:
        1. Bone — goodness
        2. Sinew — foreknowledge
        3. Flesh — divinity
        4. Marrow — lordship
        5. Blood — kingdom
        6. Skin — envy
        7. Hair — understanding

      The Kephalaia maps five faculties to five body tissues:
        1. Bone — nous/mind
        2. Sinew — thought
        3. Vein — teaching
        4. Flesh — counsel
        5. Skin — consideration

      Shared tissues: bone, sinew, flesh, skin (4 tissues appear in both).
      Different enumerations: AJ has 7, Kephalaia has 5.
      Different qualities: AJ maps archontic powers, Kephalaia maps
      intellectual faculties.

      Both texts trace their body-correspondence system to the same
      pre-literary tradition. AJ explicitly cites 'the book of Zoroaster.'
      The Kephalaia's Mani claimed access to the same Zoroastrian lineage.

      The SYSTEM is the same — spiritual quality → body tissue as
      correspondence. The specific enumeration differs. This is exactly
      what one expects from two independent transmissions of a common
      ancestor: the architecture is preserved, the specifics diverge.
    principles:
      - ancient_word
      - divine_human
      - correspondence
    confidence: strong
    notes: >
      The Kephalaia's VEIN (ⲡⲙⲟⲙⲉ) does not appear in AJ's list.
      AJ's MARROW, BLOOD, and HAIR do not appear in the Kephalaia's list.
      The two systems are not copies of each other — they are independent
      expressions of a shared architecture.

  - id: FCL-007
    category: transmission_evidence
    title: "Parthian Hymn M680 — 'doctrine, insight, teaching and skillfulness' as SEPARATE concepts"
    finding: >
      In DB Anthology 4, Hymns, a Parthian/Sogdian colophon (lines 200-205)
      lists: 'doctrine, insight, teaching and skillfulness from it would
      be learnt.'

      This is critical evidence: in the Iranian Manichaean tradition,
      'teaching' and 'insight' are SEPARATE WORDS used in the SAME
      sentence. They are not synonymous. The Manichaean scribes
      distinguished between them.

      This independently confirms that 'insight' and 'teaching' were
      not interchangeable in Manichaean vocabulary. Gardner's substitution
      of 'insight' for ⲥⲃⲱ ('teaching') collapses a distinction that
      the Manichaean tradition itself maintained.
    principles:
      - correspondence
    confidence: strong
    notes: >
      Source: DB_Anthology_4_Hymns.md line 6168. The colophon is from
      a Sogdian scribe describing the purpose of the hymn-book.

  - id: FCL-008
    category: structural_principle
    title: "Position 3 as the 'transmission' faculty across all traditions"
    finding: >
      Despite the vocabulary differences, position 3 carries a common
      functional quality across all four traditions:

      - Coptic: ⲥⲃⲱ = 'teaching' (transmission of knowledge)
      - Arabic: ʿaql = 'intellect/reason' (faculty of comprehension)
      - Syriac: 'intellect' (faculty of comprehension)
      - Parthian: ōš = 'consciousness/awareness' (receptive wakefulness)

      These are all RECEPTIVE or MEDIATING faculties — they process,
      comprehend, or receive what comes from outside. They are not
      creative or generative. They stand between the higher pair
      (nous/thought) and the lower pair (counsel/consideration) as
      the BRIDGE faculty.

      The Coptic 'teaching' names this function most precisely: the
      third faculty is what RECEIVES transmitted knowledge. The others
      name it by its cognitive mechanism (intellect, consciousness)
      rather than by its relational function (receiving teaching).

      Cosmically, position 3 corresponds to the First Man — who is
      SENT FORTH carrying the Father's attributes. He is a carrier of
      transmitted content, not a generator of his own. 'Teaching' matches
      this cosmic correspondence exactly.
    principles:
      - correspondence
      - influx
    confidence: moderate
    notes: >
      This interpretive finding depends on accepting the correspondential
      framework. At the philological level, the Coptic simply says ⲥⲃⲱ
      (teaching) and the correspondence to vein (channel of received
      life) and First Man (emissary carrying the Father's attributes)
      is observed in the Coptic text itself, not imposed from outside.

  - id: FCL-009
    category: transmission_evidence
    title: "Polotsky/Böhlig footnote reveals the ennoia back-translation"
    finding: >
      The German critical edition (1940) includes footnote 13 on p.20:

        "Koptische Übersetzung für λογισμός, ἐνθύμησις, φρόνησις, ἔννοια."

      The four Greek terms correspond to the four non-Greek Coptic
      faculty names in the order listed on line 13 (outer → inner):
        - ⲙⲁⲕⲙⲉⲕ (consideration) → λογισμός (reasoning/calculation)
        - ⲥⲁⲭⲛⲉ (counsel) → ἐνθύμησις (deliberation/pondering)
        - ⲥⲃⲱ (TEACHING) → φρόνησις (practical wisdom/prudence)
        - ⲙⲉⲩⲉ (thought) → ἔννοια (concept/notion/thought)
      (The fifth, ⲛⲟⲩⲥ = νοῦς, is a direct Greek loanword, no footnote needed.)

      CRITICAL QUESTION: WHERE DOES THE GREEK COME FROM?

      Gardner's introduction (1995, p. xviii) explicitly states: "The
      Coptic texts themselves date from about 400 c.e., and are
      translations of Syriac originals." The Kellis bilingual glossaries
      (Syriac → Lycopolitan Coptic) confirm DIRECT translation from
      Syriac, with no Greek intermediate. No Greek manuscript of the
      Kephalaia survives or is attested.

      Polotsky/Böhlig (1940) did not have the Kellis evidence and may
      have assumed a Greek intermediate — standard for religious texts
      in Egypt before the Kellis discoveries. Their footnote phrase
      "Koptische Übersetzung für" ("Coptic translation for") likely
      identifies GREEK PHILOSOPHICAL EQUIVALENTS for the Coptic terms,
      not necessarily terms from an actual Greek Vorlage.

      This means the footnote is performing SCHOLARLY BACK-TRANSLATION:
      "these are the Greek philosophical concepts that correspond to
      what the Coptic says." It is an editorial apparatus, not a
      report on a source text.

      THE CRITICAL FINDING:

      Polotsky/Böhlig identified ⲥⲃⲱ as the Coptic equivalent of
      φρόνησις (practical wisdom/prudence — one of Aristotle's four
      cardinal virtues). "Einsicht" (insight/discernment) is a
      reasonable German rendering of φρόνησις. Gardner followed with
      English "insight." The editorial chain:

        ⲥⲃⲱ (teaching) → [identified as equivalent to] φρόνησις
        → Einsicht (1940) → insight (1995)

      But the Coptic text says ⲥⲃⲱ — TEACHING. Not φρόνησις.
      The scribes who translated from Syriac into Coptic chose a
      word meaning "teaching, instruction, lesson" (Crum 317b-318a)
      to render whatever the Syriac original said at position 3.
      They did NOT use a loanword φρόνησις (which was available to
      them — it appears in other Coptic texts). They did NOT use
      ⲕⲁⲧⲁⲛⲟⲉⲓ (to perceive), ⲥⲩⲛⲉⲥⲓⲥ (understanding), or any
      Greek loanword for wisdom/discernment.

      They chose native Coptic ⲥⲃⲱ — what you RECEIVE from a teacher.
      This means the COPTIC-SPEAKING COMMUNITY understood position 3
      as a faculty of RECEIVED INSTRUCTION, not innate discernment.

      The editorial tradition then identified this with φρόνησις and
      translated through the Greek concept rather than the Coptic word.
      The Coptic scribes' interpretive choice — which preserves
      correspondential directionality (teaching = received from outside)
      — was overwritten by Greek philosophical back-translation.
    principles:
      - ancient_word
      - influx
      - correspondence
    confidence: strong
    cross_references:
      - "GTA-001 (gardner_translation_analysis.yaml) — initial discovery"
      - "GTA-002 — ⲣⲉϩ†ⲥⲃⲱ = 'teacher' confirms lexical meaning"
    notes: >
      The φρόνησις identification actually makes the Coptic choice MORE
      striking, not less. φρόνησις (practical wisdom/prudence) is one
      of the four cardinal virtues in Aristotelian philosophy. The
      German "Einsicht" is a natural rendering of φρόνησις. But
      the Coptic scribes did not use φρόνησις or any Greek wisdom-
      term. They used ⲥⲃⲱ: teaching. They understood practical
      wisdom as something RECEIVED through instruction, not as an
      innate faculty of discernment.

      Note on the Greek Vorlage question: Whether or not a Greek
      intermediate text existed, the Coptic word is ⲥⲃⲱ. If the
      scribes translated from Greek φρόνησις → Coptic ⲥⲃⲱ, that
      is a strong interpretive choice. If they translated from a
      Syriac term directly (as Gardner's evidence suggests), then
      Polotsky/Böhlig's φρόνησις is their own scholarly identification,
      and the Coptic word stands on its own merits. Either way, the
      Coptic says "teaching" and the editorial tradition says "insight."

