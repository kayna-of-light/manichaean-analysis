# FINDING 9: THE ⲡⲉⲓⲛⲉ INCONSISTENCY — BODY-COSMOS CORRESPONDENCE (p170)
# ============================================================================

  - id: GTA-012
    category: vocabulary_inconsistency
    severity: high
    coptic_term: "ⲡⲉⲓⲛⲉ / ⲁⲡⲉⲓⲛⲉ (peine / apeine)"
    standard_meaning: "likeness, image, resemblance"
    context: "Chapter 70 (K.170) — the body-cosmos correspondence map"
    evidence:
      coptic_pattern: >
        The Coptic on p170 uses a single, rigorously consistent formula
        throughout the body-cosmos mapping: ⲁⲡⲉⲓⲛⲉ ⲙ̄ⲡ... ("to the
        likeness of..."). The word ⲡⲉⲓⲛⲉ appears 10 times on this single
        page, always in the same syntactic construction, always expressing
        the same relationship: body-part X exists "to the likeness of"
        cosmic structure Y.
      coptic_passages:
        - "ⲕⲁⲧⲁ ⲡⲉⲓⲛⲉ ⲙⲡⲛⲁⲩ ⲛⲕⲟⲥⲙⲟⲥ — according to the likeness of the great cosmos"
        - "ⲁⲡⲉⲓⲛⲉ ⲙ̄ⲡⲕⲁϩ — to the likeness of the earth"
        - "ⲁⲡⲉⲓⲛⲉ ⲙ̄ⲡⲥⲧⲁⲩⲣⲟⲥ — to the likeness of the cross"
        - "Multiple additional instances, all with the same word ⲡⲉⲓⲛⲉ"
      gardner_renderings:
        - rendering: "corresponds to"
          example: "the small body corresponds to the great cosmos"
        - rendering: "like"
          example: "like the earth"
        - rendering: "accords to"
          example: "accords to the pattern of the cross"
        - rendering: "resembles"
          example: "resembles [cosmic structure]"
        - rendering: "to the pattern of"
          example: "to the pattern of [structure]"
      frequency: "10 occurrences of one Coptic word → 5 different English renderings"
    finding: >
      On p170 (Chapter 70), the Coptic uses a single word — ⲡⲉⲓⲛⲉ
      ("likeness/image") — 10 times in a rigorously consistent formula
      to map body parts to cosmic structures. Gardner renders this one
      Coptic word with FIVE different English words: "corresponds to,"
      "like," "accords to," "resembles," "to the pattern of."

      The Coptic is architecturally deliberate: the same word repeated
      in the same construction signals that ALL these body-cosmos
      relationships are the SAME KIND of relationship. The scribes
      used ⲡⲉⲓⲛⲉ consistently because they understood each mapping
      as an instance of a single principle — likeness between microcosm
      and macrocosm.

      CONFIRMED on p77-78 (Chapter 27, Five Forms in the Archons):
      ⲉⲓⲛⲉ/ⲡⲉⲓⲛⲉ appears 4+ times. Gardner renders with FOUR different
      English words: "forms" (chapter title), "corresponding to"
      (line 27-28), "likeness" (lines 31-32), "shapes" (p78:1,10).
      The pattern is independent of p170 — on every page where ⲡⲉⲓⲛⲉ
      appears in a structural role, Gardner introduces English variety
      where the Coptic maintains lexical unity.

      Gardner's variation makes each instance seem like a different kind
      of relationship (similarity here, correspondence there, pattern
      elsewhere). This obscures the systematic nature of the
      correspondence map — a reader of the English would not know that
      the Coptic uses the same word every time.

      This is the inverse of GTA-001 (ⲥⲃⲱ): there, one Coptic word
      received one wrong English word consistently. Here, one Coptic
      word receives multiple English words, hiding the consistency of
      the original.
    confidence: strong
    notes: >
      The ⲡⲉⲓⲛⲉ distribution across the corpus (gathered via grep):
      p170 = 10 occurrences, p077 = 4, p172 = 3, p173 = 3, p232 = 3,
      p285 = 3. The highest concentration is in the body-cosmos
      correspondence chapter — exactly where consistency matters most.

      Ironically, Gardner's use of "corresponds to" for one of these
      instances (noted in GTA-009) shows he RECOGNIZES the
      correspondential nature of the relationship. But by varying
      the English for the same Coptic word, he prevents the reader
