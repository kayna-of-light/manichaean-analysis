      consistently (2× on same page). Gardner is consistent here.

      POSITIVE — p285 (Ch.119): ⲁⲡⲉⲓⲛⲉ ⲙ̄ⲡϣⲁⲣⲡ ⲛ̄ⲣⲱⲙⲉ → "after
