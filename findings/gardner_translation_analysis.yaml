      "likeness" every time.

      CONFIRMS — p121 (Ch.48): ⲛ̄ⲉⲓⲛⲉ ⲛ̄ⲛϣⲏⲛ → "five shapes of
      tree" and ⲍⲛⲉⲓⲛⲉ ⲉⲓⲛⲉ → "various shapes." New English word
      "shapes" — sixth rendering for the same Coptic term.

      CONFIRMS — p241 (Ch.95): ⲍⲛ ⲍⲛⲉⲓⲛⲉ ⲉⲓⲛⲉ → "various forms."
      Same construction as p121 (ⲍⲛⲉⲓⲛⲉ ⲉⲓⲛⲉ) but rendered "forms"
      instead of "shapes." Same chapter also has "likeness" (L3860)
      and "image" (L3879) — three English words for one Coptic term
      in a single chapter.

      MIXED — p158 (Ch.55): ⲡⲉⲓⲛⲉ ⲛ̄ⲧⲍⲓⲕⲱⲛ → Gardner absorbs into
      "image" (potentially using ⲍⲓⲕⲱⲛ as the lead word). Nearby:
      "after his likeness" — so "likeness" and "image" coexist.

      REFINED VERDICT: Gardner CAN render ⲡⲉⲓⲛⲉ consistently when a
      passage repeats a fixed formula (p134, p285 — "after the likeness
      of X" 2-3× → "likeness" throughout). But when ⲡⲉⲓⲛⲉ appears in
      varied syntactic contexts on the same page, he reaches for English
      variety (p170 = 5 words, Ch.95 = 3 words, p77-78 = 4 words).
      The total English rendering inventory is now at least 6: likeness,
      image, form, shape, resemblance, pattern. The problem remains: a
      reader of the English cannot know that ONE Coptic word generates
      all these "different" relationships.

