  - id: GTA-013
    category: vocabulary_assessment
    severity: informational
    coptic_terms:
      - term: "ⲡⲥⲱⲙⲁⲧⲓⲕⲟⲛ (psōmatikon)"
        source: "Greek loanword σωματικόν"
        gardner: "corporeal"
      - term: "ⲡⲧⲩⲭⲓⲕⲟⲛ (ptychikon)"
        source: "Greek loanword ψυχικόν"
        gardner: "psychic / psychical"
      - term: "ⲡⲛⲉⲩⲙⲁⲧⲓⲕⲟⲛ (pneumatikon)"
        source: "Greek loanword πνευματικόν"
        gardner: "spiritual"
    context: "Chapter 114 (K.269-270) — three images in the elect person"
    evidence:
      coptic_passage: >
        p270 lines 13-22: The text uses these three Greek loanwords as
        labels for three discrete levels of purification through which the
        living soul ascends. The corporeal level strips bodily accretions;
        the psychic strips emotional accretions (anger, desire, envy,
        foolishness); the pneumatic/spiritual level joins with patience,
        faith, and love — with love reigning over all as the Virgin of Light.
      gardner_rendering: >
        Gardner translates ⲡⲥⲱⲙⲁⲧⲓⲕⲟⲛ as "corporeal," ⲡⲧⲩⲭⲓⲕⲟⲛ as
        "psychic/psychical," and ⲡⲛⲉⲩⲙⲁⲧⲓⲕⲟⲛ as "spiritual." The
        translation of the first two retains the Greek technical register,
        but "spiritual" for πνευματικόν loses the parallelism — the reader
        does not see that all three terms belong to the same Greek
        terminological system (somatic/psychic/pneumatic).
      structural_observation: >
        These three levels map to Swedenborg's three discrete degrees:
        natural (σωματικόν → corporeal/effect plane), spiritual (ψυχικόν →
        soul/truth plane), and celestial (πνευματικόν → spirit/love plane).
        The Kephalaia passage confirms the Manichaean system uses the same
        Valentinian three-fold anthropology — and the capstone is love
        (ⲧⲁⲅⲁⲡⲏ) reigning over all, which is the celestial principle.
    finding: >
      Gardner's rendering is largely faithful here. The only notable choice
      is translating πνευματικόν as "spiritual" rather than "pneumatic,"
      which breaks the visible parallelism of the Greek loanword system
      (corporeal/psychic/pneumatic → corporeal/psychic/spiritual). This
      is a minor accommodation — "pneumatic" would be opaque to general
      readers — but it means a reader of the English cannot immediately
      see that all three terms are Greek technical vocabulary from the
      same system. Gardner partially compensates in his chapter introduction
      where he names the tripartite system explicitly.
    confidence: strong
    notes: >
      The structural significance is not in the translation quality but
      in the content: the Kephalaia explicitly employs a three-tiered
      anthropology using the same Greek terms as Valentinian texts
      (1 Cor 2:14-15 psychikos/pneumatikos; Irenaeus's tripartite
      classification of hylic/psychic/pneumatic). The passage confirms
      that Manichaean soteriology operates on discrete degrees, with
      love (ⲧⲁⲅⲁⲡⲏ) as the ruling principle of the highest degree —
      precisely the Swedenborgian architecture.

